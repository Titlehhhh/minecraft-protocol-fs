name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # facts/minecraft-data (submodule) is not needed: the DSL and the sandbox
        # build from Spec/ alone, and facts/ has its own preview SDK.

      - uses: actions/setup-dotnet@v4
        with:
          # not global-json-file: the root global.json pins "10.0.0" and relies on
          # rollForward, but setup-dotnet takes that number literally and no SDK
          # artifact named 10.0.0 exists (SDKs ship as 10.0.1xx).
          dotnet-version: 10.0.x

      - name: Build the DSL project
        run: dotnet build minecraft-protocol-fs/minecraft-protocol-fs.fsproj -c Release

      - name: Generate C# from the specs
        run: dotnet run --project minecraft-protocol-fs/minecraft-protocol-fs.fsproj -c Release --no-build -- gen

      - name: Build the sandbox against the generated C#
        run: dotnet build minecraft-protocol-fs.slnx -c Release

      # The console asserts its way through every generated shape and throws on the first
      # mismatch, so a build alone proves the code compiles, not that it round-trips.
      - name: Round-trip the generated C#
        run: dotnet run --project sandbox/McProtoNet.Sandbox.Console -c Release --no-build
